# Rebuilds data/nfl/players.json and extends data/nfl/puzzles.json from
# nflverse once a week during the season (Tuesday morning, after Monday
# Night Football), so new team-seasons and trades show up as valid links.
# Puzzles dated today or earlier (Eastern) are never changed; future ones
# are re-checked and replaced only if new data changed their par.
#
# Scheduled runs only happen from the repository's default branch, and
# GitHub may start them a little late when it is busy. "Run workflow" on the
# Actions tab runs it by hand.
name: Update data

on:
  schedule:
    - cron: "0 11 * 9-12,1-2 2"   # Tuesdays 11:00 UTC, September through February
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Past seasons never change, so keep the downloaded parquet files between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - run: pip install -r tools/requirements.txt

      - name: Build data from nflverse
        run: python tools/build_data.py

      - name: Check the data
        run: |
          python tools/test_data.py
          npm test

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update data from nflverse ($(date -u +%Y-%m-%d))"
          git push
