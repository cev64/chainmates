# Rebuilds data/nfl/players.json and extends data/nfl/puzzles.json from
# nflverse every morning during the season, so new team-seasons and trades
# show up as valid links and the prime-time puzzles follow the schedule:
# when a game is flexed or moved, or a game-day player leaves that roster,
# the future puzzle for that night is re-picked. Puzzles dated today or
# earlier (Eastern) are never changed.
#
# Scheduled runs only happen from the repository's default branch, and
# GitHub may start them a little late when it is busy. "Run workflow" on the
# Actions tab runs it by hand.
name: Update data

on:
  schedule:
    - cron: "0 11 * 8-12,1-2 *"   # daily 11:00 UTC (7am Eastern in season), August through February
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Past seasons never change, so keep the downloaded parquet files between runs.
      - uses: actions/cache@v4
        with:
          path: .cache/nflverse
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - run: pip install -r tools/requirements.txt

      - name: Build data from nflverse
        run: python tools/build_data.py

      - name: Check the data
        run: |
          python tools/test_data.py
          npm test

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update data from nflverse ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Ship the new data to the live site.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
