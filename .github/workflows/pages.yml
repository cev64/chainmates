# Deploys the web app to GitHub Pages.
# - On every push to main that touches the site, core or data.
# - After the daily data refresh commits new data (update-data.yml calls this,
#   because a commit made by the workflow's own token doesn't trigger push runs).
# - By hand: "Run workflow" on the Actions tab.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", "core/**", "data/**", "tools/build_site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}   # the branch tip, so a call right after the data commit deploys that commit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: tools/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
